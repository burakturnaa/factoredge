# Şimdilik HOST Mac'te test ediliyor (bkz. plan "Durum/Devam Notu"); VM'e taşındığında bu dosya
# aynen VM içine kopyalanıp orada `docker compose up` ile çalıştırılacak — build context ve
# servisler değişmeyecek, sadece host->VM ağ adresi (apps/api/.env'deki MODBUS_HOST/MQTT_BROKER_URL)
# güncellenecek.
services:
  bant1-modbus:
    build:
      context: ..
      dockerfile: vm/bant1-modbus/Dockerfile
    container_name: bant1-modbus
    ports:
      - "5020:5020"
    restart: unless-stopped

  bant2-mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: bant2-mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./bant2-mqtt-broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  bant2-mqtt-publisher:
    build:
      context: ..
      dockerfile: vm/bant2-mqtt-publisher/Dockerfile
    container_name: bant2-mqtt-publisher
    environment:
      MQTT_BROKER_URL: mqtt://bant2-mqtt-broker:1883
      DEVICE_ID: band2
    depends_on:
      - bant2-mqtt-broker
    restart: unless-stopped
